
syntax = "proto3";

package parking.v1;

option go_package = "github.com/your-team/kvs/gen/parking/v1;parkingv1";

service ParkingService {
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse);
  rpc AddSpace(AddSpaceRequest) returns (AddSpaceResponse);
  rpc CreateSpacesBatch(CreateSpacesBatchRequest) returns (CreateSpacesBatchResponse);
  rpc PutSpace(PutSpaceRequest) returns (PutSpaceResponse);
  rpc PatchSpace(PatchSpaceRequest) returns (PatchSpaceResponse);
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);

  rpc CreateReservation(CreateReservationRequest) returns (CreateReservationResponse);
  rpc GetReservation(GetReservationRequest) returns (GetReservationResponse);
  rpc CancelReservation(CancelReservationRequest) returns (CancelReservationResponse);

  rpc GetParkingStats(GetParkingStatsRequest) returns (GetParkingStatsResponse);
}

enum Consistency {
  CONSISTENCY_UNSPECIFIED = 0;
  CONSISTENCY_SEQUENTIAL = 1;
  CONSISTENCY_LINEARIZABLE = 2;
}

enum SpaceType {
  SPACE_TYPE_UNSPECIFIED = 0;
  SPACE_TYPE_REGULAR = 1;
  SPACE_TYPE_ACCESSIBLE = 2;
}

enum SpaceStatus {
  SPACE_STATUS_UNSPECIFIED = 0;
  SPACE_STATUS_AVAILABLE = 1;
  SPACE_STATUS_RESERVED = 2;
}

message ParkingSpace {
  string space_id = 1;
  SpaceType type = 2;
  SpaceStatus status = 3;
  optional string reservation_id = 4;
}

message Reservation {
  string reservation_id = 1;
  string space_id = 2;
  string license_plate = 3;
  bool has_accessible_permit = 4;
  string created_at = 5;
  string expires_at = 6;
}

message ParkingStats {
  int32 total_spaces = 1;
  int32 available_spaces = 2;
  int32 reserved_spaces = 3;
  int32 regular_spaces = 4;
  int32 accessible_spaces = 5;
}


//
// 1. List all parking spaces
//
message ListSpacesRequest {
  optional SpaceType type = 1;
  optional SpaceStatus status = 2;
  Consistency consistency = 3;
}

message ListSpacesResponse {
  repeated ParkingSpace spaces = 1;
}

//
// 2. Get one parking space
//
message GetSpaceRequest {
  string space_id = 1;
  Consistency consistency = 2;
}

message GetSpaceResponse {
  ParkingSpace space = 1;
}

//
// 3. Add a parking space
//
message AddSpaceRequest {
  string space_id = 1;
  SpaceType type = 2;
}

message AddSpaceResponse {
  ParkingSpace space = 1;
}

//
// 4. Create or update a parking space (PUT)
//
message PutSpaceRequest {
  string space_id = 1;
  SpaceType type = 2;
}

message PutSpaceResponse {
  ParkingSpace space = 1;
  bool created = 2;
}

//
// 5. Delete a parking space
//
message DeleteSpaceRequest {
  string space_id = 1;
}

message DeleteSpaceResponse {
}

//
// 6. Create a parking reservation
//
message CreateReservationRequest {
  string license_plate = 1;
  bool has_accessible_permit = 2;
  optional string space_id = 3;
}

message CreateReservationResponse {
  Reservation reservation = 1;
}

//
// 7. Get an existing reservation
//
message GetReservationRequest {
  string reservation_id = 1;
  Consistency consistency = 2;
}

message GetReservationResponse {
  Reservation reservation = 1;
}

//
// 8. Cancel a reservation
//
message CancelReservationRequest {
  string reservation_id = 1;
}

message CancelReservationResponse {
}

//
// 9. Get parking lot statistics
//
message GetParkingStatsRequest {
  Consistency consistency = 1;
}

message GetParkingStatsResponse {
  ParkingStats stats = 1;
}

// Partially update an existing parking space.
// Unlike PutSpace, this operation never creates a new space.
message PatchSpaceRequest {
  string space_id = 1;
  SpaceType type = 2;
}

message PatchSpaceResponse {
  ParkingSpace space = 1;
}

// Create several parking spaces with one gRPC request.
// Part I returns dummy results without persisting changes.
message CreateSpacesBatchRequest {
  repeated CreateSpacesBatchItem spaces = 1;
}

message CreateSpacesBatchItem {
  string space_id = 1;
  SpaceType type = 2;
}

message CreateSpacesBatchResponse {
  repeated ParkingSpace spaces = 1;
}
